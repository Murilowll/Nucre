<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0" />
    </radialGradient>
    <pattern id="meshPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="800" height="500" fill="url(#greenGrad)" />
  <rect width="800" height="500" fill="url(#meshPattern)" />
  <circle cx="400" cy="250" r="220" fill="url(#greenGlow)" />

  <!-- Center Card Badge -->
  <g transform="translate(400, 250)">
    <rect x="-170" y="-85" width="340" height="170" rx="16" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    
    <!-- Camera / Image Icon -->
    <g transform="translate(0, -25)">
      <circle cx="0" cy="0" r="26" fill="rgba(255, 255, 255, 0.15)" />
      <path d="M-12 6 h24 a2 2 0 0 0 2 -2 v-14 a2 2 0 0 0 -2 -2 h-4.5 l-2 -3 h-7 l-2 3 h-4.5 a2 2 0 0 0 -2 2 v14 a2 2 0 0 0 2 2 z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
      <circle cx="0" cy="-2" r="4.5" fill="none" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Text -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">FOTO DO SERVIÇO</text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.8)" text-anchor="middle" letter-spacing="0.5">Em breve disponível</text>
  </g>
</svg>
